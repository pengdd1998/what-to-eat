name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tree-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫公开树 B 级模式（IP/别名/路径）——误红优于漏放
        run: |
          python3 scripts/ci_tree_hygiene.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11.13" }
      - run: pip install -q -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11.13" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh   # smoke 脚本 shebang zsh
      - run: pip install -q -r requirements.txt -r requirements-dev.txt
      - run: ./scripts/smoke_local.sh

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11.13" }
      - run: pip install -q -r requirements.txt
      - run: WTE_ENV=dev python scripts/ci_migrations.py

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q   # 静态校验：拦的正是 YAML/插值错误（F1——原 || 兜底恒绿）
